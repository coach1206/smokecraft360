name: Deploy SmokeCraft frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build SmokeCraft app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds --trust-lockfile

      - name: Build SmokeCraft frontend
        working-directory: artifacts/smokecraft
        env:
          BASE_PATH: /smokecraft360/
          NODE_ENV: production
        run: pnpm build

      - name: Add Pages SPA fallback
        run: |
          cp artifacts/smokecraft/dist/public/index.html artifacts/smokecraft/dist/public/404.html
          touch artifacts/smokecraft/dist/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/smokecraft/dist/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
